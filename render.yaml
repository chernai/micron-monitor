# Render Blueprint — optional alternate deploy path. Not the primary
# recommendation: since persistence now lives in Supabase (not local disk),
# Streamlit Community Cloud + Supabase + GitHub Actions (see README) is the
# genuinely free path. Use this instead if you want an always-on host
# without depending on GitHub Actions for scheduling — Render's free web
# service tier now works fine here since no persistent disk is needed.
#
# Deploy: render.com -> New -> Blueprint -> select this repo. Render reads
# this file automatically. You'll still need to set DATABASE_URL yourself
# in the Render dashboard (Environment tab) — secrets aren't stored in this
# file or the repo.
services:
  - type: web
    name: micron-monitor
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python3 db/init_db.py"
    startCommand: "streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: MICRON_MONITOR_ENABLE_SCHEDULER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false   # set manually in the Render dashboard — not committed
